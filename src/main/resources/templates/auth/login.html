<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      lang="ja" th:with="pageTitle='Login'">
<head><meta charset="UTF-8"/><title th:text="${pageTitle}">Login</title></head>
<body th:replace="~{_layout/base :: layout(~{::section})}">
<section>
    <h1>Login</h1>
    <div th:if="${param.error}">
        <p style="color:red;">メールアドレスまたはパスワードが正しくありません。</p>
    </div>
    <form method="post" th:action="@{/login}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div><label>Email <input type="email" name="username" required></label></div>
        <div><label>Password <input type="password" name="password" required></label></div>
        <button type="submit">Sign in</button>
    </form>
    <p><a th:href="@{/register}">Create account</a></p>
</section>
</body>
</html>
