<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${pageTitle} ?: 'EC'">EC</title>
    <style>
        body{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
        nav{padding:8px;border-bottom:1px solid #ddd}
        .container{max-width:960px;margin:24px auto}
        table{border-collapse:collapse;width:100%}
        th,td{border:1px solid #ddd;padding:6px 10px}
        footer{padding:8px;border-top:1px solid #ddd;margin-top:24px;color:#555}
    </style>
</head>
<body th:fragment="layout(content)">
<!-- ヘッダ（共通） -->
<header>
    <nav>
        <span sec:authorize="isAuthenticated()">
            <span style="float:light">
                <a th:href="@{/}">Home</a> |
                <a th:href="@{/products}">Products</a>
                <span sec:authorize="hasRole('ADMIN')">
                     | <a th:href="@{/admin/products}">Admin</a>
                </span>
            </span>
        </span>
        <span style="float:right">
            <span sec:authorize="isAuthenticated()">
                Hello, <span th:text="${#authentication.name}">user</span> |
                <form th:action="@{/logout}" method="post" style="display:inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" style="background:none;border:none;color:#06c;cursor:pointer">Logout</button>
                </form>
            </span>
            <span sec:authorize="isAnonymous()">
                <a th:href="@{/login}">Login</a> / <a th:href="@{/register}">Register</a>
            </span>
        </span>
    </nav>
</header>

<!-- コンテンツ -->
<main class="container">
    <div th:insert="${content}">content</div>
</main>

<!-- フッタ（共通） -->
<footer>
    &copy; <span th:text="${#temporals.format(#temporals.createNow(),'yyyy')}">2025</span> My EC
</footer>
</body>
</html>
