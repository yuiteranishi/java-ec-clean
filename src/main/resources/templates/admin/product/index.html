<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja" th:with="pageTitle='Admin - Products'">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${pageTitle}">Admin - Products</title>
</head>
<body th:replace="~{_layout/base :: layout(~{::section})}">
<section>
    <h1>Products (Admin)</h1>

    <!-- フィードバック（クエリパラメータ） -->
    <p th:if="${param.created}" style="color:#070;">Created: [[${param.created}]]</p>
    <p th:if="${param.updated}" style="color:#070;">Updated: [[${param.updated}]]</p>
    <p th:if="${param.deleted}" style="color:#c00;">Deleted: [[${param.deleted}]]</p>

    <div style="margin: 12px 0;">
        <a th:href="@{/admin/products/new}">+ New Product</a>
    </div>

    <table border="1" cellpadding="6" cellspacing="0" style="border-collapse: collapse; width:100%;">
        <thead>
        <tr>
            <th style="width:5%">ID</th>
            <th style="width:30%">Name</th>
            <th style="width:10%">Price</th>
            <th style="width:10%">Stock</th>
            <th style="width:20%">Category</th>
            <th style="width:25%">Actions</th>
        </tr>
        </thead>
        <tbody>
        <!-- products は AdminProductSummaryView（record）のリスト -->
        <tr th:each="p : ${products}">
            <td th:text="${p.id()}">1</td>
            <td th:text="${p.name()}">Coffee Beans</td>
            <td th:text="${p.price()}">1200.00</td>
            <td th:text="${p.stockQty()}">30</td>
            <td th:text="${p.category()}">Coffee</td>
            <td>
                <a th:href="@{|/admin/products/${p.id()}/edit|}">Edit</a>
                &nbsp;|&nbsp;
                <!-- セキュアな POST 削除（CSRF 必須） -->
                <form th:action="@{|/admin/products/${p.id()}/delete|}" method="post" style="display:inline"
                      onsubmit="return confirm('Delete this product?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(products)}">
            <td colspan="6" style="text-align:center; color:#666;">No products</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
